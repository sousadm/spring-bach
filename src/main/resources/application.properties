spring.application.name=batch

# Porta padrão do Spring Boot
server.port=8080

# --- Configuração do Banco H2 (Local/Arquivo) ---
# Se preferir em memória (apaga ao fechar): jdbc:h2:mem:testdb
# Abaixo, ele cria um arquivo chamado 'batchdb' na pasta do projeto
spring.datasource.url=jdbc:h2:file:./data/batch_db;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# --- Console do H2 (Opcional, para visualizar os dados no navegador) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA/Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Configuração do Spring Batch ---
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false